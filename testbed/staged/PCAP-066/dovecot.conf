# ==============================================================================
# SECUREMAILSCOPE TESTBED - RENDERED DOVECOT.CONF FOR PCAP-066
# ==============================================================================
# Description: N/A
# ==============================================================================

protocols = imap
listen = *

# Native container stdout logging
log_path = /dev/stdout
info_log_path = /dev/stdout
debug_log_path = /dev/stdout
verbose_ssl = yes
auth_verbose = yes

# Authentication & Spool
disable_plaintext_auth = no
auth_mechanisms = plain login

passdb {
  driver = passwd-file
  args = scheme=PLAIN username_format=%u /etc/dovecot/users
}

userdb {
  driver = static
  args = uid=vmail gid=vmail home=/var/mail/%u
}

mail_location = maildir:/var/mail/%u/Maildir

# ------------------------------------------------------------------------------
# TLS Presence & Security Level
# ------------------------------------------------------------------------------
ssl = yes

# TLS Protocol Restrictions
ssl_min_protocol = TLSv1.2

# Service & Listener Definitions
service imap-login {
  inet_listener imap {
    port = 143
  }
  inet_listener imaps {
    port = 993
    ssl = yes
  }
}
