# ==============================================================================
# SECUREMAILSCOPE TESTBED - RENDERED DOVECOT.CONF FOR PCAP-124
# ==============================================================================
# Description: POP3 STLS accepted
# ==============================================================================

protocols = pop3
listen = *

# Native container stdout logging
log_path = /dev/stdout
info_log_path = /dev/stdout
debug_log_path = /dev/stdout
verbose_ssl = yes
auth_verbose = yes

# Authentication & Spool
disable_plaintext_auth = no
auth_mechanisms = plain login

passdb {
  driver = passwd-file
  args = scheme=PLAIN username_format=%u /etc/dovecot/users
}

userdb {
  driver = static
  args = uid=vmail gid=vmail home=/var/mail/%u
}

mail_location = maildir:/var/mail/%u/Maildir

# ------------------------------------------------------------------------------
# TLS Presence & Security Level
# ------------------------------------------------------------------------------
ssl = yes

# Certificate Chain & Key Injection
ssl_cert = </etc/mailtest/active/chain.pem
ssl_key = </etc/mailtest/active/key.pem

# TLS Protocol Restrictions
ssl_min_protocol = TLSv1.3
ssl_cipher_suites = TLS_AES_128_GCM_SHA256

# Service & Listener Definitions
service pop3-login {
  inet_listener pop3 {
    port = 110
  }
  inet_listener pop3s {
    port = 995
    ssl = yes
  }
}
